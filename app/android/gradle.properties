org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 项目父目录含中文字符（用户机器路径），跳过 AGP 的非 ASCII 路径检查
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 本机网络代理（Gradle 依赖下载）
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7893
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7893
# Maven 仓库直连白名单（代理节点对 dl.google.com 不稳定，直连更可靠）
systemProp.https.nonProxyHosts=dl.google.com|repo.maven.apache.org|maven.aliyun.com
systemProp.http.nonProxyHosts=dl.google.com|repo.maven.apache.org|maven.aliyun.com
# Kotlin 守护进程在 junction 路径下增量缓存异常 → 改进程内编译
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
